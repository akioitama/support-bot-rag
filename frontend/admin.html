<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin - AI Support System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="topbar">
        <a class="brand" href="chat.html">AI Support System</a>
        <nav id="nav"></nav>
    </div>
    <div class="page">
        <div class="panel" id="admin-content">
            <h1>User Management</h1>
            <p class="muted">Registered users in the system.</p>
            <p class="error" id="error"></p>
            <table>
                <thead>
                    <tr>
                        <th>Email</th>
                        <th>Name</th>
                        <th>Role</th>
                        <th>Messages</th>
                    </tr>
                </thead>
                <tbody id="users-body"></tbody>
            </table>

            <h2>Support documents</h2>
            <p class="muted">Upload PDFs. They are processed in the background. Chat uses only ready documents.</p>
            <form id="upload-form">
                <input id="pdf-file" type="file" accept=".pdf,application/pdf">
                <button type="submit">Upload PDF</button>
            </form>
            <p class="muted" id="upload-status"></p>
            <table>
                <thead>
                    <tr>
                        <th>File</th>
                        <th>Status</th>
                        <th>Chunks</th>
                        <th>Error</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="documents-body"></tbody>
            </table>
        </div>
    </div>
    <script src="app.js"></script>
    <script>
        initAdminPage();
    </script>
</body>
</html>
